                   <!-- Barra de Pesquisa -->

                   <span class="material-sybols-outlined"></span>

      <style>
            body{
                  font-family: 'Helvetica', sans-serif;
                  background-image: #163891;
            }
            .box{
                  position: absolute;
                  top: 60%;
                  left: 50%;
                  transform: translate(-50%,-50%);
                  background-color: #163891;
                  padding: 80px;
                  border-radius: 100px;
                  width: 50%;
            }
            legend{
                  border: 30px solid white;
                  padding: 20px;
                  text-align: center;
                  background-color: white;
                  border-radius: 8px;
            }
            .inputBox{
                  position: relative;
                  color:black;
            }
            .imputUser{
                  background: none;
                  padding: 20px;
                  border: none;
                  border-bottom: 50px solid #163891;
                  outline: none;
                  color: #163891;
                  font-size: 50px;
                  width: 100%;
                  letter-spacing: 2px;
            }
            .labelInput{
                  position: absolute;
                  top: 0px;
                  left: 0px;
            pointer-events: none;
            transition: .5s;
      }
      .inputUser:focus ~ .labelInput,
      .inputUser:valid ~ .labelInput{
            top: -20px;
            font-size: 12px;
            color: #163891;
      }
      #data_nascimento{
            border: none;
            padding: 20px;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
      }      
      #submit{
            background-color: linear-gradient(to right, rgb(0, 92, 197), #163891);
            width: 100%;
            border:none;
            padding: 15px;
            color: black;
            font-size: 15px;
            cursor: pointer;
            border-radius: 10px;
      }
      #submit:hover{
            background-image: linear-gradient(to right, rgb(0, 80, 172), #163891);
      }
      </style>
</head>
<body>
      <div class="box">
            <form action="">
                  <fieldset>
                        <legend><b>Novo Cadastro</b></legend>
                        <br>
                        <div class="inputBox">
                              <input type="text" name="nome" id="nome" class="inputUser" required>
                              <label for="nome" class="labelInput">Nome Completo</label>
                        </div>
                        <br><br>
                        <div class="inputBox">
                              <input type="text" name="email" id="email" class="inputUser" required>
                              <label for="email"class="labelInput">Email</label>
                        </div>
                        <br><br>
                        <div class="inputBox">
                              <input type="tel" name="telefone" id="telefone" class="inputUser" required>
                              <label for="telefone"class="labelInput">Telefone</label>
                        </div>
                        <br>
                        <p>Sexo:</p>
                        <input type="radio" id="feminino" name="genero" value="Feminino" required>
                        <label for="feminino">Feminino</label>
                        <br>
                        <input type="radio" id="masculino" name="genero" value="Masculino" required>
                        <label for="masculino">Masculino</label>
                        <br>
                        <input type="radio" id="outro" name="genero" value="Outro" required>
                        <label for="outro">Outro</label>
                        <br>
                        <div class="inputBox">
                              <label for="data_nascimento">Data de Nascimento</label>
                              <input type="date" name="data_nascimento" id="data_nascimento" class="inputUser" required>
                        </div>
                        <br><br>
                        <div class="inputBox">
                              <input type="text" name="cidade" id="cidade" class="inputUser" required>
                              <label for="cidade"class="labelInput">Cidade</label>
                        </div>
                        <br><br>
                        <div class="inputBox">
                              <input type="text" name="estado" id="estado" class="inputUser" required>
                              <label for="estado"class="labelInput">Estado</label>
                        </div>
                        <br><br>
                        <div class="inputBox">
                              <input type="text" name="endereço" id="endereço" class="inputUser" required>
                              <label for="endereço"class="labelInput">Endereço</label>
                        </div>
                        <br><br>
                        <input type="submit" name="submit" id="submit"
                  </fieldset>
            </form>
      </div>
</body>
</html>
